name: NeoGram Mobile Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install project dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install --no-save @capacitor/cli@^8 @capacitor/core@^8 @capacitor/android@^8

      - name: Build web application
        run: npm run build:production

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoGram-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install project dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install --no-save @capacitor/cli@^8 @capacitor/core@^8 @capacitor/ios@^8

      - name: Build web application
        run: npm run build:production

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app Payload/
          mkdir -p artifacts
          cd Payload
          zip -r ../artifacts/NeoGram-unsigned.ipa .
          cd ..

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeoGram-Unsigned-IPA
          path: artifacts/NeoGram-unsigned.ipa
