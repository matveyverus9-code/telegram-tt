
name: NeoGram Mobile Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Configure GitHub HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: npm install --allow-git=all

      - name: Install Capacitor
        run: npm install --no-save --allow-git=all @capacitor/cli@^8 @capacitor/core@^8 @capacitor/android@^8

      - name: Build web application
        run: npm run build:production
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

      - name: Create Android platform
        run: npx cap add android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Sync Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew

          for attempt in 1 2 3; do
            if ./gradlew assembleDebug; then
              exit 0
            fi

            echo "Gradle attempt $attempt failed"

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done

          exit 1

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoGram-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Configure GitHub HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: npm install --allow-git=all

      - name: Install Capacitor
        run: npm install --no-save --allow-git=all @capacitor/cli@^8 @capacitor/core@^8 @capacitor/ios@^8

      - name: Build web application
        run: npm run build:production
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

      - name: Create iOS platform
        run: npx cap add ios

      - name: Sync iOS
        run: npx cap sync ios

      - name: Build unsigned iOS application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find build/ios/Build/Products -type d -name App.app -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App.app was not found"
            exit 1
          fi

          rm -rf Payload artifacts
          mkdir -p Payload artifacts

          cp -R "$APP_PATH" Payload/App.app

          zip -qry artifacts/NeoGram-unsigned.ipa Payload

          test -s artifacts/NeoGram-unsigned.ipa

          unzip -tq artifacts/NeoGram-unsigned.ipa

          unzip -Z1 artifacts/NeoGram-unsigned.ipa | grep -q '^Payload/App\.app/'

          echo "IPA successfully packaged and verified"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeoGram-Unsigned-IPA
          path: artifacts/NeoGram-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
